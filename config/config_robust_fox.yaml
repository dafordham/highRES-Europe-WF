    41,
  ]
  onwind_clc_buffer : {
    1 : 1000,
    2 : 1000,
    6 : 5000,
  }
  windturbines : {
    "onshore" : "Vestas_V112_3MW",
    "offshore_bottom" : "NREL_ReferenceTurbine_2020ATB_15MW_offshore",
    "offshore_float" : "NREL_ReferenceTurbine_2020ATB_15MW_offshore",
  }

  wind_smooth: False
  windon_af: 0.95
  windoff_bottom_af: 0.95
  windoff_floating_af: 0.95

cplex_options:
  lpmethod: 4
  solutiontype: 2
  # Also the CPUs each solve job asks for
  threads: 30
  predual: 1
  BarOrder: 0
  barepcomp: 1E-7
