target: "results.db"

paths:
  # GAMS 54.1 since 2026-09-15. 49.4 is rejected by the license server ("Node ID
  # for category 2 not defined, please update your GAMS"); 52.5's time-limited
  # license has expired. The 57 runs solved in Aug 2026 used 49.4 -- check one
  # known point reproduces under 54.1 before pooling the two in one grid.
  gams: /fp/projects01/ec85/.bin/gams/gams54.1_linux_x64_64_sfx/  # slash at the end is required
  shared_input: shared_input
  # Must point at the checkout that HAS the shed_mode switch (commit 6d1e830 or
  # later). After the fox cleanup this is the single consolidated checkout.
  abs_shared_code: /fp/projects01/ec85/models/davidac/highRES-Europe-WF/resources/highRES-Europe-GAMS/
  # work_<machine>_<horizon>_<mode>. Project storage: backed up and permanent.
  # NOT $HOME (50 GiB quota; a full-year results.db is ~1.2 GB) and NOT
  # /cluster/work/ (purged after 30 days).
  results: /fp/projects01/ec85/models/davidac/work_fox_1year_depthcap

parameters:
  mode: [
    "normal", 
    #"developer", # Use this mode to run the model in developer mode
  ]
  years: [
    # "1995",
    "2010",
  ]
  spatials: [
    # "grid",
    "region",
    # "nuts2",
  ]

  # Shed-tolerance formulation: off | yearly | hourly | depthcap
  shed_mode: "depthcap"

  # SECOND PASS: fill the depth axis between 0.1 and 1.0.
  #
  # The coarse pass left a factor-of-ten hole there, and at eps=0.1 the cost is
  # still falling steeply across it (110,997 -> 95,988 M€, 13.5% unresolved) --
  # so the saturation depth cannot be located from the coarse grid at all.
  #
  # Never put 0.0 in epsilons: a zero budget forbids shedding whatever delta
  # says, so it yields len(deltas) identical runs. The strict-adequacy baseline
  # is a single run at (0, 0) -- request that path explicitly as a target.
  #
  # Points with delta <= epsilon are degenerate: the depth cap alone fixes the
  # shed volume at delta * total_demand, so cost depends on delta only and the
  # value repeats down the column. 3 of the 12 coarse runs were such duplicates
  # (~50 core-hours). Keeping them here is deliberate -- pruning needs a
  # Snakefile change, and they cost nothing now that they are already solved.
  # eps=0.05 added so the budget axis has four points rather than three -- the
  # cost surface (R2) and the implied-price figure (R5) are both read along it.
  epsilons: [0.005, 0.02, 0.05, 0.1]
  deltas:   [0.005, 0.02, 0.1, 0.2, 0.3, 0.5, 1.0]

  windoff_floating: True
  power_system_scenario: ["BASE"]

  # Options: "intensity", "budget"
  co2_target_type: "intensity"
  
  # Options: "all"
  co2_target_extent: "all"

  # Options: "OFF","TYNDP","USER"
  trans_inv: "TYNDP"
  
  # Only used if trans_inv set to USER
  trans_cap_lim: 20
  
  bias_correction: True

  elevation_excl: False
  onshore_slope_excl: True
  include_rooftop: True

  unit_commitment: "OFF"
  frequency_response: "OFF"
  store_uc: "OFF"

  emis_price: 0
  store_initial_level: 0.5
  store_final_level: 0.5
  hydro_res_initial_fill: 0.8
  hydro_res_min: 0.5
  pgen: 20.0

  cutoff_solar: 0.09
  cutoff_onwind: 0.1
  cutoff_offwind: 0.20
  
  # Full year. The two ~50 GB input rules key on aggregated_regions, not on
  # date_range, so this is safe while the 28-zone list stays identical -- the
  # existing intermediate_data/ can be reused rather than rebuilt.
  date_range: ["01-01", "12-31"]

  EV: "OFF"
  EV_scenario: ["BASE"]
  EV_flex: 0
  V2G: "OFF"
  EV_pcap: 0.011
  EV_soc_min: 0.2
  EV_soc_max: 0.8

  aggregated_regions: [
    "AT",
    "BE",
    "BG",
    "CH",
    "CZ",
    "DE",
    "DK",
    "EE",
    "ES",
    "FI",
    "FR",
    "UK",
    "GR",
