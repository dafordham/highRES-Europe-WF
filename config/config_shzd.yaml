target: "results.db.compressed"

paths:
  gams: /opt/gams/gams50.4_linux_x64_64_sfx/  # slash at the end is required
  shared_input: shared_input
  abs_shared_code: /home/shzd/Documents/highRES/highRES-Europe-WF/resources/highRES-Europe-GAMS/
  results: work

parameters:
  mode: [
    "normal", 
    #"developer", # Use this mode to run the model in developer mode
  ]
  #Weather years either needs to be one for all horizon run or same number as planning_horizons entries
  #to be run for different weather years for different planning_horizons.  
  years: [
    #"1995",
    "2010",
  ]
  spatials: [
    # "grid",
    "region",
    # "nuts2",
  ]

  windoff_floating: True
  power_system_scenario: ["BASE"]
  energy_system_scenario: ["BASE"]

  # Planning years. limit the list to one year for snapshot run
  planning_horizons: ["2030", "2032", "2040"]

  # year to which exisiting capacity considered for first planning horizon
  baseline_year: 2026

  # Allowance (MW) per technology for the technical growth-rate ceiling,
  # so a tech with little/no build history isn't permanently capped at zero growth.
  # anything not listed here defaults to a seed of 0.
  gen_growth_seed_mw:
    Solar: 1000
    Windonshore: 1000
    Windoffshore: 1000
    WindoffshoreFloat: 1000
    HydroRoR: 1000

  # Growth rate scenarios (need to be defined in technoeconomic db)
  growth_rate_scenarios: ["early","late"]

  # Options: "intensity", "budget"
  co2_target_type: "intensity"
  
  # Options: "all"
  co2_target_extent: "all"

  # CO2 scenarios
  emission_scenarios: ["BASE","Late","Early"]

  # Solar exclusion scenarios
  solar_scenarios: ["low"]
  # Wind exclusion scenarios
  wind_scenarios: ["low","high"]

  # Define scenarios for tranmission expansion
  # Options: "OFF","TYNDP","USER"
  trans_inv: ["TYNDP", "USER"]
  
  # Only used if trans_inv set to USER
  trans_cap_lim: 20
  
  bias_correction: True

  elevation_excl: False
  onshore_slope_excl: True
  include_rooftop: True

  unit_commitment: "OFF"
  frequency_response: "OFF"
  store_uc: "OFF"

  emis_price: 0
  store_initial_level: 0.5
  store_final_level: 0.5
  hydro_res_initial_fill: 0.8
  hydro_res_min: 0.5
  pgen: 20.0

  cutoff_solar: 0.09
  cutoff_onwind: 0.1
  cutoff_offwind: 0.20
  
  date_range: ["01-01", "01-31"]

  EV: "ON"
  EV_scenario: ["BASE"]
  EV_flex: 0
