    "onshore" : "Vestas_V112_3MW",
    "offshore_bottom" : "NREL_ReferenceTurbine_2020ATB_15MW_offshore",
    "offshore_float" : "NREL_ReferenceTurbine_2020ATB_15MW_offshore",
  }

  wind_smooth: False
  windon_af: 0.95
  windoff_bottom_af: 0.95
  windoff_floating_af: 0.95

cplex_options:
