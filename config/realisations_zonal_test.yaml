# [cl] mock realisations for testing, not real weather
# each one scales up demand in one country, the rest stay as they are
# (varying wind vs sun didn't work: the expansion just buys thermal, which
# doesn't care about weather, so there was never a second expansion)
# run with --tolerance 0.02, at 0.05 stress_AT clears at 4.25% after the
# first expansion
- name: median
- name: stress_PL
  demand_zone: {PL: 1.45}
- name: stress_AT
  demand_zone: {AT: 1.45}
