# CLIMATE-ROBUST PATHWAYS. Dispatch a fixed fleet, minimising ENS.
#
# This is an OVERLAY, not a standalone config. It carries only what differs from
# config_pathways_local_5day.yaml and is applied on top of it:
#
#   snakemake --configfile config/config_pathways_local_5day.yaml \
#                          config/config_pathways_local_5day_dispatch.yaml
#
# Snakemake merges multiple --configfile arguments recursively, later files
# winning. It is an overlay deliberately: the fleet being fixed here was solved
# against the t0 config's inputs, so date_range, aggregated_regions, the clc
# lists and the scenario assumptions MUST be identical. Duplicating the file
# would let them drift, and a drifted date_range would silently pin a fleet to
# a horizon it was never solved on.
#
# Order of operations. The .dd must live inside this run's own model directory,
# because GAMS runs with cwd=modelpath and datafolderpath is ".":
#
#   1. solve t0                   (the base config on its own)
#   2. snakemake ... --until build_inputs     (creates this run's modelpath)
#   3. caps2dd.py --from <t0 results.db> --to <this modelpath>/fixed_caps.dd
#   4. snakemake ...              (solves)

paths:
  # Separate results root: results.gdx is protected(), so the t0 run's output
  # cannot be overwritten in place.
  results: work_local_5day_dispatch

parameters:
  # Name of the .dd holding the solved fleet, without the extension. Every
  # capacity in the system is pinned to it. Only dispatch stays free.
  fix_fleet: "fixed_caps"

  # Minimise energy not served instead of minimising cost. Cost is not
  # constrained: the operating-cost cap and delta were dropped 2026-10-02, so
  # ENS is the least unserved energy this fleet can manage at any cost.
  ens_obj: "ON"
